[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "immich-smart-albums"
version = "0.1.0"
description = "CLI tool to create curated photo albums in Immich using AI-powered quality scoring"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "rbflo"}]
requires-python = ">=3.11"
keywords = ["immich", "photo", "album", "ai", "curation", "duplicate-detection", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12.0,<1",
    "click>=8.0,<9",
    "immichpy>=7.0.0,<8",
    "httpx>=0.27.0,<1",
    "ollama>=0.4.0,<1",
    "tenacity>=8.3.0,<10",
    "rich>=13.7.0,<14",
    "imagehash>=4.3.1,<5",
    "Pillow>=10.3.0,<14",
    "pydantic>=2.7.0,<3",
    "PyYAML>=6.0,<7",
    "faiss-cpu>=1.7.4,<2",
    "numpy>=1.24.0,<3",
    # Pinned to a specific commit rather than the default branch (CO-03):
    # an unpinned git dependency means every build -- including CI and both
    # Docker images -- re-resolves to whatever the upstream default branch
    # currently points at. This project relies on ProtocolsRegistry's exact
    # API (create/get_instance/set_instance/clear_instances), so an
    # upstream change can silently break builds with no local diff to
    # explain why. Bump this hash deliberately when picking up upstream
    # changes.
    "protocols-system @ git+https://github.com/rfloresx/ProtocolsSystem.git@77eb984c935593add1ccd91a126d7d8becaacb5b",
]

[project.optional-dependencies]
# HEIC/HEIF decoding support (iPhone photos). Optional because the pure
# Python/Pillow install can't decode HEIC without it; when absent, the LLM
# clients report a clear "pillow-heif not installed" error for HEIC input
# instead of silently sending undecodable bytes (CL-08).
heif = [
    "pillow-heif>=0.16.0,<1",
]
huggingface = [
    "transformers>=4.38.0,<5",
    "torch>=2.0.0",
]
geo = [
    "googlemaps>=4.10.0,<5",
]
openai = [
    "openai>=1.0.0,<3",
]
dev = [
    "pytest>=8.2.0,<9",
    "pytest-asyncio>=0.23.0,<2",
    "hypothesis>=6.100.0,<7",
    "mypy>=1.10.0,<2",
]
webgui = [
    "nicegui>=2.0,<3",
    "aiosqlite>=0.20.0,<1",
    "bcrypt>=4.0,<5",
]

[project.scripts]
smart-albums = "smart_albums.cli:app"

[project.urls]
Homepage = "https://github.com/rfloresx/Smart-Albums"
Repository = "https://github.com/rfloresx/Smart-Albums"
Issues = "https://github.com/rfloresx/Smart-Albums/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.mypy]
strict = true
packages = ["smart_albums", "webgui"]
mypy_path = ["src"]
disable_error_code = ["type-abstract"]

[[tool.mypy.overrides]]
module = [
    "immichpy.*",
    "ollama.*",
    "imagehash.*",
    "faiss.*",
    "transformers.*",
    "sentence_transformers.*",
    "torch.*",
    "nicegui.*",
    "aiosqlite.*",
    "bcrypt.*",
    "yaml.*",
    "googlemaps.*",
]
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "webgui.pages.*",
    "webgui.main",
    "webgui.components.*",
    "webgui.services.*",
]
disable_error_code = ["no-untyped-def", "no-untyped-call", "no-any-return", "assignment", "union-attr", "type-arg", "index", "call-overload", "arg-type", "comparison-overlap"]

[[tool.mypy.overrides]]
module = "smart_albums.clients.huggingface_embedding"
disable_error_code = ["no-untyped-call", "union-attr", "operator", "attr-defined", "unused-ignore"]

[[tool.mypy.overrides]]
module = "smart_albums.clients.immich"
disable_error_code = ["call-arg", "arg-type", "attr-defined"]

[tool.ruff]
# Linting was previously not configured at all and not run in CI, so a
# class of real bugs (unused imports, bare `raise` inside `except` losing
# the cause, blocking calls in async functions) went uncaught (DK-06).
# This config enables a focused, high-signal rule set rather than ruff's
# full default, so the CI lint step is meaningful without drowning in
# stylistic noise.
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = [
    "F",      # pyflakes: unused imports/variables, undefined names
    "B",      # flake8-bugbear: likely bugs
    "ASYNC",  # flake8-async: blocking calls in async code
]
# B008 (function call in default arg) fires on the Typer/NiceGUI
# `x = typer.Option(...)` / `ui.*` idioms, which are intentional there.
ignore = ["B008"]

[tool.hatch.metadata]
# Required to allow the git direct reference for protocols-system.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/smart_albums", "src/webgui"]
