[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "immich-smart-albums"
version = "0.1.0"
description = "CLI tool to create curated photo albums in Immich using AI-powered quality scoring"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "rbflo"}]
requires-python = ">=3.11"
keywords = ["immich", "photo", "album", "ai", "curation", "duplicate-detection", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12.0,<1",
    "click>=8.0,<9",
    "rich>=13.7.0,<14",
    "imagehash>=4.3.1,<5",
    "Pillow>=10.3.0,<14",
    "pydantic>=2.7.0,<3",
    "PyYAML>=6.0,<7",
    "faiss-cpu>=1.7.4,<2",
    "numpy>=1.24.0,<3",
    # Provider implementations (immich/ollama/llamacpp/image_embedding/
    # google_places/local) now live in the shared protocols-system package;
    # the [providers] extra pulls httpx, immichpy, tenacity, and ollama. The
    # [openai] extra adds the OpenAI LLM provider. Pinned to an exact version
    # rather than a git SHA so every build (CI + Docker images) resolves the
    # same published artifact without needing git in the image, and so both
    # consumers stay in lockstep on one version (CO-03 / SIMPLIFICATION 2.2).
    "protocols-system[providers,openai]==0.2.0",
]

[project.optional-dependencies]
# HEIC/HEIF decoding support (iPhone photos). The decode/convert path and the
# "pillow-heif not installed" error now live in protocols-system's shared
# llm_support module, so pull its [heif] extra.
heif = [
    "protocols-system[heif]==0.2.0",
]
# Local CLIP-family image embeddings — the HuggingFace provider moved into
# protocols-system; pull its [huggingface] extra (transformers + torch).
huggingface = [
    "protocols-system[huggingface]==0.2.0",
]
# Google Places reverse geocoding provider moved into protocols-system; the
# base [providers] extra does not include googlemaps, so expose it here.
geo = [
    "googlemaps>=4.10.0,<5",
]
# OpenAI LLM provider is pulled by the base dependency's [openai] extra, but
# keep this group so `pip install .[openai]` still resolves.
openai = [
    "protocols-system[openai]==0.2.0",
]
dev = [
    "pytest>=8.2.0,<9",
    "pytest-asyncio>=0.23.0,<2",
    "hypothesis>=6.100.0,<7",
    "mypy>=1.10.0,<2",
]
webgui = [
    "nicegui>=2.0,<3",
    "aiosqlite>=0.20.0,<1",
    # bcrypt is pulled via protocols-system's [webauth] extra, which owns the
    # shared password-hashing primitives used by webgui.auth.
    "protocols-system[webauth]==0.2.0",
]

[project.scripts]
smart-albums = "smart_albums.cli:app"

[project.urls]
Homepage = "https://github.com/rfloresx/Smart-Albums"
Repository = "https://github.com/rfloresx/Smart-Albums"
Issues = "https://github.com/rfloresx/Smart-Albums/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.mypy]
strict = true
packages = ["smart_albums", "webgui"]
mypy_path = ["src"]
disable_error_code = ["type-abstract"]

[[tool.mypy.overrides]]
module = [
    "immichpy.*",
    "ollama.*",
    "imagehash.*",
    "faiss.*",
    "transformers.*",
    "sentence_transformers.*",
    "torch.*",
    "nicegui.*",
    "aiosqlite.*",
    "bcrypt.*",
    "yaml.*",
    "googlemaps.*",
]
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "webgui.pages.*",
    "webgui.main",
    "webgui.components.*",
    "webgui.services.*",
]
disable_error_code = ["no-untyped-def", "no-untyped-call", "no-any-return", "assignment", "union-attr", "type-arg", "index", "call-overload", "arg-type", "comparison-overlap"]

[tool.ruff]
# Linting was previously not configured at all and not run in CI, so a
# class of real bugs (unused imports, bare `raise` inside `except` losing
# the cause, blocking calls in async functions) went uncaught (DK-06).
# This config enables a focused, high-signal rule set rather than ruff's
# full default, so the CI lint step is meaningful without drowning in
# stylistic noise.
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = [
    "F",      # pyflakes: unused imports/variables, undefined names
    "B",      # flake8-bugbear: likely bugs
    "ASYNC",  # flake8-async: blocking calls in async code
]
# B008 (function call in default arg) fires on the Typer/NiceGUI
# `x = typer.Option(...)` / `ui.*` idioms, which are intentional there.
ignore = ["B008"]

[tool.hatch.metadata]
# Required to allow the git direct reference for protocols-system.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/smart_albums", "src/webgui"]
